<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conversor-yt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --chao:    #0e1116;
    --painel:  #181d27;
    --fundo:   #0a0d12;
    --linha:   #28313f;
    --tinta:   #e8ebf2;
    --apagado: #8b95a8;
    --fraco:   #5f6a7d;
    --ambar:   #f2a33c;
    --menta:   #58d3a6;
    --rosa:    #e8697d;
    --gelo:    #7fa7d9;
    --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(120% 80% at 50% -20%, #1a2130 0%, transparent 60%),
      var(--chao);
    color: var(--tinta);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 6vw, 72px) 18px 72px;
  }

  .deck { width: 100%; max-width: 680px; }

  .so-leitor {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---- placa de identificação ---- */
  .placa {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--linha);
  }
  .placa h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .placa p {
    margin: 10px 0 0;
    max-width: 44ch;
    color: var(--apagado);
    font-size: 15px;
  }
  .lampada {
    flex: none;
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--apagado);
    white-space: nowrap;
  }
  .lampada::before {
    content: "";
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--linha);
    box-shadow: 0 0 0 3px rgba(40, 49, 63, .35);
    transition: background .25s, box-shadow .25s;
  }
  .lampada[data-estado="rodando"]::before {
    background: var(--ambar);
    box-shadow: 0 0 10px 1px rgba(242, 163, 60, .55);
    animation: pulsa 1.4s ease-in-out infinite;
  }
  .lampada[data-estado="concluido"]::before {
    background: var(--menta);
    box-shadow: 0 0 10px 1px rgba(88, 211, 166, .5);
  }
  .lampada[data-estado="erro"]::before {
    background: var(--rosa);
    box-shadow: 0 0 10px 1px rgba(232, 105, 125, .5);
  }
  .lampada[data-estado="cancelado"]::before { background: var(--gelo); }
  @keyframes pulsa { 50% { opacity: .35; } }

  /* ---- área de entrada ---- */
  form { margin: 26px 0 0; }

  .rotulo {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 9px;
  }
  .rotulo label { font-size: 14px; color: var(--apagado); }
  .contagem {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fraco);
    font-variant-numeric: tabular-nums;
  }

  textarea {
    width: 100%;
    min-height: 148px;
    resize: vertical;
    padding: 16px 18px;
    border: 1px solid var(--linha);
    border-radius: 10px;
    background: var(--fundo);
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, .45);
    color: var(--tinta);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.85;
  }
  textarea::placeholder { color: #566073; }
  textarea:focus { border-color: #3c4a60; outline: none; }

  .controles {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .direita { display: flex; align-items: center; gap: 12px; }

  /* interruptor de formato */
  .chave {
    display: flex;
    padding: 4px;
    gap: 4px;
    border: 1px solid var(--linha);
    border-radius: 10px;
    background: var(--fundo);
  }
  .chave input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chave span {
    display: block;
    padding: 9px 22px;
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--apagado);
    cursor: pointer;
    transition: color .18s, background .18s;
  }
  .chave span small {
    display: block;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 400;
    color: var(--fraco);
    letter-spacing: .01em;
  }
  .chave span:hover { color: var(--tinta); }
  .chave input:checked + span {
    background: var(--painel);
    color: var(--tinta);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 2px 6px rgba(0, 0, 0, .4);
  }
  .chave input:checked + span small { color: var(--apagado); }
  .chave input:focus-visible + span { outline: 2px solid var(--ambar); outline-offset: 2px; }

  button {
    padding: 12px 30px;
    border: 0;
    border-radius: 9px;
    background: var(--ambar);
    color: #1b1206;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: filter .18s, transform .08s, border-color .18s, color .18s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button[disabled] { background: var(--linha); color: var(--apagado); cursor: not-allowed; filter: none; }

  button.fantasma {
    padding: 10px 18px;
    background: transparent;
    border: 1px solid var(--linha);
    color: var(--apagado);
    font-size: 13.5px;
    font-weight: 400;
  }
  button.fantasma:hover { filter: none; color: var(--tinta); border-color: #3c4a60; }
  button.fantasma[disabled] { background: transparent; color: var(--fraco); }

  .atalho {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--fraco);
    white-space: nowrap;
  }

  :focus-visible { outline: 2px solid var(--ambar); outline-offset: 3px; }

  .destino {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fraco);
  }
  .destino #caminho { overflow-wrap: anywhere; }
  button.pequeno { padding: 6px 12px; font-size: 12px; border-radius: 7px; }

  .aviso {
    margin-top: 18px;
    padding: 13px 16px;
    border-left: 3px solid var(--rosa);
    border-radius: 0 8px 8px 0;
    background: rgba(232, 105, 125, .09);
    color: #f6c3cb;
    font-size: 14.5px;
  }
  .aviso[hidden] { display: none; }

  /* ---- medidor + fila ---- */
  .fila { margin-top: 36px; }
  .fila[hidden] { display: none; }

  .leitura {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 11px;
  }
  .leitura .onde { font-size: 15px; color: var(--apagado); overflow-wrap: anywhere; }
  .leitura .pct { font-family: var(--mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }

  .medidor {
    display: flex;
    gap: 3px;
    height: 26px;
    padding: 5px;
    border: 1px solid var(--linha);
    border-radius: 7px;
    background: var(--fundo);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, .5);
  }
  .medidor i {
    flex: 1;
    border-radius: 1.5px;
    background: #1d2531;
    transition: background .2s, box-shadow .2s;
  }
  .medidor i.on {
    background: var(--ambar);
    box-shadow: 0 0 7px rgba(242, 163, 60, .45);
  }
  .medidor.pronto i.on { background: var(--menta); box-shadow: 0 0 7px rgba(88, 211, 166, .4); }
  .medidor.parado i.on { background: var(--gelo); box-shadow: none; }
  .medidor.falhou i.on { background: var(--rosa); box-shadow: 0 0 7px rgba(232, 105, 125, .4); }

  .resumo {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    margin: 13px 0 0;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--apagado);
  }
  .resumo b { font-weight: 500; color: var(--tinta); }
  .resumo span[data-zero="sim"] { color: var(--fraco); }
  .resumo span[data-zero="sim"] b { color: var(--fraco); }

  ul.itens { list-style: none; margin: 22px 0 0; padding: 0; }
  ul.itens li {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 4px 13px;
    align-items: baseline;
    padding: 13px 2px;
    border-top: 1px solid var(--linha);
  }
  ul.itens li:last-child { border-bottom: 1px solid var(--linha); }
  .marca { font-family: var(--mono); font-size: 13px; line-height: 1.4; }
  .titulo { font-size: 15px; overflow-wrap: anywhere; }
  .lado { font-family: var(--mono); font-size: 12px; color: var(--apagado); font-variant-numeric: tabular-nums; }
  .nota { grid-column: 2 / -1; font-size: 13px; color: var(--apagado); overflow-wrap: anywhere; }
  .nota:empty { display: none; }

  li[data-estado="pendente"] .titulo { color: var(--apagado); }
  li[data-estado="pendente"] .marca { color: #39424f; }
  li[data-estado="baixando"] .marca { color: var(--ambar); }
  li[data-estado="ok"] .marca { color: var(--menta); }
  li[data-estado="pulado"] .marca { color: var(--gelo); }
  li[data-estado="cancelado"] .marca { color: var(--fraco); }
  li[data-estado="cancelado"] .titulo { color: var(--apagado); }
  li[data-estado="erro"] .marca { color: var(--rosa); }
  li[data-estado="erro"] .nota { color: #f0a9b4; }

  .acoes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
  }
  .acoes[hidden] { display: none; }

  @media (max-width: 560px) {
    .placa { flex-direction: column; gap: 14px; }
    .controles { flex-direction: column; align-items: stretch; }
    .direita { flex-direction: column; align-items: stretch; }
    .atalho { display: none; }
    .chave { justify-content: center; }
    .chave span { flex: 1; text-align: center; }
    .leitura .pct { font-size: 19px; }
    .acoes button { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="deck">
  <header class="placa">
    <div>
      <h1>conversor-yt</h1>
      <p>Cole os links, escolha o formato e acompanhe a fila. Um link por linha.</p>
    </div>
    <span class="lampada" id="lampada" data-estado="ocioso">ocioso</span>
  </header>

  <form id="forma" novalidate>
    <div class="rotulo">
      <label for="links">Links do YouTube</label>
      <span class="contagem" id="contagem">nenhum link ainda</span>
    </div>
    <textarea id="links" name="links" spellcheck="false"
      placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>

    <div class="controles">
      <div class="chave" role="radiogroup" aria-label="Formato de saída">
        <label>
          <input type="radio" name="formato" value="mp3" checked>
          <span>MP3 <small>só o áudio</small></span>
        </label>
        <label>
          <input type="radio" name="formato" value="mp4">
          <span>MP4 <small>vídeo completo</small></span>
        </label>
      </div>
      <div class="direita">
        <span class="atalho">Ctrl + Enter</span>
        <button type="submit" id="botao">Baixar</button>
      </div>
    </div>

    <p class="destino">
      <span id="caminho">{{ pasta }}</span>
      <button type="button" class="fantasma pequeno" id="abrir">Abrir a pasta</button>
    </p>
    <p class="aviso" id="aviso" role="alert" hidden></p>
  </form>

  <p class="so-leitor" id="locutor" role="status" aria-live="polite"></p>

  <section class="fila" id="fila" hidden>
    <div class="leitura">
      <span class="onde" id="onde">Preparando a fila</span>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="medidor" id="medidor" role="progressbar" aria-label="Progresso da fila"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    <p class="resumo" id="resumo"></p>
    <ul class="itens" id="itens" aria-label="Itens da fila"></ul>
    <div class="acoes" id="acoes" hidden>
      <button type="button" class="fantasma" id="parar">Parar a fila</button>
      <button type="button" class="fantasma" id="repetir" hidden>Tentar de novo os que falharam</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  const SEGMENTOS = 36;
  const TITULO = "conversor-yt";
  const MARCAS = { pendente: "·", baixando: "▸", ok: "✓", pulado: "≡", erro: "✕", cancelado: "—" };
  const ROTULOS = {
    pendente: "na fila", baixando: "baixando", ok: "pronto",
    pulado: "pulado", erro: "erro", cancelado: "parado"
  };

  const $ = (id) => document.getElementById(id);
  const forma = $("forma"), campoLinks = $("links"), botao = $("botao");
  const contagem = $("contagem"), aviso = $("aviso"), lampada = $("lampada");
  const locutor = $("locutor"), fila = $("fila"), onde = $("onde"), pct = $("pct");
  const medidor = $("medidor"), resumo = $("resumo"), itens = $("itens");
  const acoes = $("acoes"), parar = $("parar"), repetir = $("repetir"), abrir = $("abrir");

  for (let i = 0; i < SEGMENTOS; i++) medidor.appendChild(document.createElement("i"));
  const barras = medidor.querySelectorAll("i");

  let timer = null;
  let jobAtual = null;
  let linhas = [];        // elementos da lista, reaproveitados entre as consultas
  let ultimoAnuncio = "";

  /* ---------- utilidades de tela ---------- */

  function lampadaEm(estado, texto) {
    lampada.dataset.estado = estado;
    lampada.textContent = texto;
  }

  function anuncia(texto) {
    if (texto !== ultimoAnuncio) {
      ultimoAnuncio = texto;
      locutor.textContent = texto;
    }
  }

  function mostraAviso(texto) {
    aviso.textContent = texto;
    aviso.hidden = false;
  }

  function limpaAviso() {
    aviso.hidden = true;
    aviso.textContent = "";
  }

  function pintaMedidor(valor, classe) {
    const acesos = Math.round((valor / 100) * SEGMENTOS);
    barras.forEach((b, i) => b.classList.toggle("on", i < acesos));
    medidor.classList.toggle("pronto", classe === "pronto");
    medidor.classList.toggle("parado", classe === "parado");
    medidor.classList.toggle("falhou", classe === "falhou");
    medidor.setAttribute("aria-valuenow", String(Math.round(valor)));
  }

  function contaLinks() {
    const total = campoLinks.value.split("\n").filter(l => l.trim()).length;
    contagem.textContent = total === 0 ? "nenhum link ainda"
      : total === 1 ? "1 link" : total + " links";
  }

  /* ---------- lista da fila ---------- */

  function montaLinhas(total) {
    itens.replaceChildren();
    linhas = [];
    for (let i = 0; i < total; i++) {
      const li = document.createElement("li");
      const marca = document.createElement("span");
      marca.className = "marca";
      marca.setAttribute("aria-hidden", "true");
      const titulo = document.createElement("span");
      titulo.className = "titulo";
      const lado = document.createElement("span");
      lado.className = "lado";
      const nota = document.createElement("span");
      nota.className = "nota";
      li.append(marca, titulo, lado, nota);
      itens.appendChild(li);
      linhas.push({ li, marca, titulo, lado, nota });
    }
  }

  function atualizaLinha(item, indice) {
    const alvo = linhas[indice];
    if (!alvo) return;
    const marca = MARCAS[item.estado] || "·";
    const titulo = item.titulo || item.link;
    const lado = item.estado === "baixando" ? item.percentual + "%"
      : (ROTULOS[item.estado] || item.estado);

    if (alvo.li.dataset.estado !== item.estado) alvo.li.dataset.estado = item.estado;
    if (alvo.marca.textContent !== marca) alvo.marca.textContent = marca;
    if (alvo.titulo.textContent !== titulo) alvo.titulo.textContent = titulo;
    if (alvo.lado.textContent !== lado) alvo.lado.textContent = lado;
    if (alvo.nota.textContent !== (item.mensagem || "")) alvo.nota.textContent = item.mensagem || "";
  }

  function escreveResumo(tarefa) {
    const partes = [
      ["sucessos", "pronto", "prontos"], ["falhas", "falha", "falhas"],
      ["pulados", "pulado", "pulados"], ["repetidos", "repetido", "repetidos"]
    ].filter(([chave]) => chave !== "repetidos" || tarefa.repetidos > 0);

    resumo.replaceChildren();
    partes.forEach(([chave, um, varios]) => {
      const valor = tarefa[chave];
      const bloco = document.createElement("span");
      bloco.dataset.zero = valor === 0 ? "sim" : "nao";
      const num = document.createElement("b");
      num.textContent = String(valor);
      bloco.append(num, document.createTextNode(" " + (valor === 1 ? um : varios)));
      resumo.appendChild(bloco);
    });
  }

  /* ---------- ciclo de vida da fila ---------- */

  function desenha(tarefa) {
    const total = tarefa.total || 1;
    const terminou = tarefa.estado === "concluido" || tarefa.estado === "cancelado";
    const parados = ["pendente", "baixando"];
    const feitos = tarefa.itens.filter(i => !parados.includes(i.estado)).length;
    const emCurso = tarefa.itens.find(i => i.estado === "baixando");
    const parcial = emCurso ? emCurso.percentual / 100 : 0;
    const geral = Math.min(100, ((feitos + parcial) / total) * 100);
    const arredondado = Math.round(geral);

    pct.textContent = arredondado + "%";
    pintaMedidor(geral,
      tarefa.estado === "cancelado" ? "parado"
        : !terminou ? ""
          : tarefa.falhas > 0 ? "falhou" : "pronto");

    tarefa.itens.forEach(atualizaLinha);
    escreveResumo(tarefa);

    if (tarefa.estado === "cancelado") {
      onde.textContent = "Fila parada em " + feitos + " de " + total;
    } else if (terminou) {
      onde.textContent = "Fila encerrada";
    } else if (emCurso) {
      onde.textContent = "Item " + tarefa.atual + " de " + total + ": " + (emCurso.titulo || emCurso.link);
    } else {
      onde.textContent = "Item " + Math.max(1, tarefa.atual) + " de " + total;
    }

    const falhados = tarefa.itens.filter(i => i.estado === "erro");
    repetir.hidden = falhados.length === 0;
    repetir.textContent = "Tentar de novo " +
      (falhados.length === 1 ? "o link que falhou" : "os " + falhados.length + " que falharam");
    repetir.dataset.links = falhados.map(i => i.link).join("\n");

    if (terminou) {
      document.title = TITULO;
      parar.hidden = true;
      botao.disabled = false;
      botao.textContent = "Baixar";

      if (tarefa.estado === "cancelado") {
        lampadaEm("cancelado", "parado");
        anuncia("Fila parada. " + tarefa.sucessos + " prontos.");
      } else if (tarefa.falhas > 0) {
        lampadaEm("erro", tarefa.falhas + (tarefa.falhas === 1 ? " com falha" : " com falhas"));
        anuncia("Fila encerrada com " + tarefa.falhas +
          (tarefa.falhas === 1 ? " falha" : " falhas") + " e " + tarefa.sucessos + " prontos.");
        mostraAviso("Alguns links não baixaram — o motivo está em cada linha. Se o YouTube mudou algo, atualize o yt-dlp com: pip install -U yt-dlp");
      } else {
        lampadaEm("concluido", "tudo pronto");
        anuncia("Fila encerrada. " + tarefa.sucessos + " prontos.");
      }
    } else {
      document.title = TITULO + " — " + arredondado + "%";
      parar.hidden = false;
      lampadaEm("rodando", "baixando " + tarefa.atual + "/" + total);
      anuncia("Item " + tarefa.atual + " de " + total + ", " + arredondado + " por cento.");
    }
  }

  async function consulta(jobId) {
    const resposta = await fetch("/status/" + encodeURIComponent(jobId));
    const dados = await resposta.json();
    if (!resposta.ok) throw new Error(dados.erro || "Não foi possível ler o progresso.");
    if (jobId !== jobAtual) return;
    desenha(dados);
    if (dados.estado === "rodando") {
      timer = setTimeout(() => consulta(jobId).catch(falhou), 800);
    }
  }

  function falhou(erro) {
    document.title = TITULO;
    lampadaEm("erro", "parado");
    parar.hidden = true;
    botao.disabled = false;
    botao.textContent = "Baixar";
    mostraAviso(erro.message || "Algo deu errado ao falar com o servidor.");
  }

  async function envia(texto) {
    limpaAviso();
    if (timer) { clearTimeout(timer); timer = null; }

    const links = texto.trim();
    if (!links) {
      mostraAviso("Cole pelo menos um link do YouTube para começar.");
      campoLinks.focus();
      return;
    }

    const formato = forma.querySelector('input[name="formato"]:checked').value;
    botao.disabled = true;
    botao.textContent = "Baixando";
    lampadaEm("rodando", "enviando");

    try {
      const resposta = await fetch("/baixar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ links, formato })
      });
      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.erro || "O servidor recusou o pedido.");

      jobAtual = dados.job_id;
      fila.hidden = false;
      acoes.hidden = false;
      parar.hidden = false;
      repetir.hidden = true;
      onde.textContent = "Preparando a fila";
      pct.textContent = "0%";
      pintaMedidor(0, "");
      resumo.replaceChildren();
      montaLinhas(dados.total);
      fila.scrollIntoView({ behavior: "smooth", block: "nearest" });
      await consulta(dados.job_id);
    } catch (erro) {
      falhou(erro);
    }
  }

  /* ---------- eventos ---------- */

  forma.addEventListener("submit", (evento) => {
    evento.preventDefault();
    envia(campoLinks.value);
  });

  campoLinks.addEventListener("input", contaLinks);

  campoLinks.addEventListener("keydown", (evento) => {
    if ((evento.ctrlKey || evento.metaKey) && evento.key === "Enter") {
      evento.preventDefault();
      forma.requestSubmit();
    }
  });

  parar.addEventListener("click", async () => {
    if (!jobAtual) return;
    parar.disabled = true;
    parar.textContent = "Parando";
    try {
      await fetch("/cancelar/" + encodeURIComponent(jobAtual), { method: "POST" });
    } catch (erro) {
      mostraAviso("Não consegui avisar o servidor para parar.");
    } finally {
      parar.disabled = false;
      parar.textContent = "Parar a fila";
    }
  });

  repetir.addEventListener("click", () => {
    const links = repetir.dataset.links || "";
    if (!links) return;
    campoLinks.value = links;
    contaLinks();
    envia(links);
  });

  abrir.addEventListener("click", async () => {
    try {
      const resposta = await fetch("/abrir-pasta", { method: "POST" });
      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.erro);
    } catch (erro) {
      mostraAviso(erro.message || "Não consegui abrir a pasta dos downloads.");
    }
  });

  /* lembra o formato escolhido entre as sessões */
  const salvo = localStorage.getItem("conversor-yt:formato");
  if (salvo === "mp3" || salvo === "mp4") {
    const alvo = forma.querySelector('input[value="' + salvo + '"]');
    if (alvo) alvo.checked = true;
  }
  forma.querySelectorAll('input[name="formato"]').forEach(radio => {
    radio.addEventListener("change", () => {
      localStorage.setItem("conversor-yt:formato", radio.value);
    });
  });

  contaLinks();
})();
</script>
</body>
</html>
